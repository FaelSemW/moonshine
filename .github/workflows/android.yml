name: Cliente Android

on:
  push:
    branches: [main]
    paths:
      - 'client/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'client/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK (Moonshine + Moonlight embutido)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout com submodules (moonlight-common-c)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK fixado pelo projeto
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;29.0.14206865" > /dev/null

      - name: Compilar APK (nonRoot debug)
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRootDebug --no-daemon --stacktrace

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: moonshine-client-android
          path: client/android/app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
