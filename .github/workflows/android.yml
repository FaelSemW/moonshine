name: Cliente Android

on:
  push:
    branches: [main]
    paths:
      - 'client/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'client/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK (Moonshine + Moonlight embutido)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout com submodules (moonlight-common-c)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar NDK fixado (usa Android SDK pré-instalado do runner)
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"
          fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;29.0.14206865"

      - name: Compilar APK (nonRoot debug)
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRootDebug --no-daemon --stacktrace

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: moonshine-client-android
          path: client/android/app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
