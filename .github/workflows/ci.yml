name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testar HOST (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verificar sintaxe
        run: npm run check
      - name: Rodar testes
        run: npm test
      - name: Subir HOST e checar saúde
        run: |
          MOONSHINE_DATA_DIR="$RUNNER_TEMP/msdata" node host/src/index.js &
          sleep 2
          curl -fsS http://127.0.0.1:47990/api/health
          curl -fsS http://127.0.0.1:47990/api/setup-required

  shellcheck:
    name: Validar instalador bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning deploy/bazzite/install.sh || true
          bash -n deploy/bazzite/install.sh
