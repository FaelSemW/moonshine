<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>Moonshine · Cloud Gaming</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <img src="/icon.svg" alt="" width="26" height="26" />
        <span>Moonshine</span>
      </div>
      <div id="machineBadge" class="badge badge-idle" aria-live="polite">—</div>
      <button id="accountBtn" class="ghost hidden" aria-label="Conta">Conta</button>
    </header>

    <main id="view" class="view"></main>

    <div id="toast" class="toast hidden" role="status" aria-live="assertive"></div>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
